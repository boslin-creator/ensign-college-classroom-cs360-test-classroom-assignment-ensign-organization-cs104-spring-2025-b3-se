<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Assistant ManagerPRO</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f5f7fb;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        body.assistant-closed {
            align-items: end;
            justify-items: end;
            background: transparent;
        }

        main {
            width: min(100%, 820px);
            height: min(760px, calc(100vh - 48px));
            min-height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            border: 1px solid #e3e8f0;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgb(22 34 58 / 9%);
        }

        body.assistant-closed main {
            display: none;
        }

        #assistant-launcher {
            display: none;
            width: 62px;
            height: 62px;
            align-items: center;
            justify-content: center;
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 100;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(145deg, #20a66a 0%, #198754 100%);
            box-shadow: 0 10px 28px rgb(25 135 84 / 30%);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        body.assistant-closed #assistant-launcher {
            display: flex;
        }

        #close-assistant {
            display: none;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #68748a;
            background: #f1f4f9;
            font-size: 20px;
        }

        body:not(.assistant-closed) #close-assistant {
            display: flex;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            border-bottom: 1px solid #e9edf4;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            position: relative;
            color: #fff;
            background: linear-gradient(145deg, #20a66a 0%, #198754 100%);
            border-radius: 50%;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -2px;
            box-shadow: 0 4px 10px rgb(35 126 165 / 18%);
        }

        .logo::after {
            content: "";
            position: absolute;
            left: 10px;
            right: 9px;
            bottom: 8px;
            height: 3px;
            border-radius: 999px;
            background: #f4c44e;
            transform: skewX(-20deg);
        }

        h1 { margin: 0; font-size: 17px; }
        .subtitle { margin: 3px 0 0; color: #68748a; font-size: 13px; }

        button, textarea { font: inherit; }
        button {
            border: 0;
            cursor: pointer;
        }

        #new-chat {
            padding: 9px 12px;
            color: #46536a;
            background: #f1f4f9;
            border-radius: 10px;
            font-size: 13px;
        }

        #new-chat:hover { background: #e8edf5; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .message {
            width: fit-content;
            max-width: min(85%, 620px);
            margin: 0 0 16px;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .assistant {
            color: #28334a;
            background: #f1f4f9;
            border-bottom-left-radius: 5px;
        }

        .user {
            margin-left: auto;
            color: #fff;
            background: #198754;
            border-bottom-right-radius: 5px;
        }

        .error { color: #8c2525; background: #fff0ef; }

        form {
            padding: 16px 20px 12px;
            border-top: 1px solid #e9edf4;
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 9px;
            border: 1px solid #dfe5ef;
            border-radius: 15px;
            background: #fff;
        }

        textarea {
            flex: 1;
            min-height: 42px;
            max-height: 160px;
            resize: vertical;
            padding: 10px 8px;
            border: 0;
            outline: 0;
            color: inherit;
        }

        #send {
            min-width: 82px;
            padding: 11px 15px;
            color: white;
            background: #198754;
            border-radius: 10px;
            font-weight: 650;
        }

        #send:disabled { opacity: .55; cursor: wait; }
        .hint { margin: 9px 4px 0; color: #7a8497; font-size: 12px; text-align: center; }

        @media (max-width: 560px) {
            body { padding: 0; }
            main { height: 100vh; min-height: 100vh; border: 0; border-radius: 0; }
            header { padding: 16px; }
            #messages { padding: 18px 16px; }
            form { padding: 12px; }
            .message { max-width: 92%; }
        }
    </style>
</head>
<body>
    <button id="assistant-launcher" type="button" aria-label="Ouvrir l'assistant ManagerPRO">MP</button>
    <main>
        <header>
            <div class="brand">
                <div class="logo" aria-hidden="true">MP</div>
                <div>
                    <h1>Assistant ManagerPRO</h1>
                    <p class="subtitle">Pose tes questions dans la langue de ton choix</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
                <button id="new-chat" type="button">Nouvelle discussion</button>
                <button id="close-assistant" type="button" aria-label="Fermer l'assistant">&times;</button>
            </div>
        </header>

        <section id="messages" role="log" aria-live="polite" aria-label="Conversation">
            <div class="message assistant">Bonjour ! Je peux répondre à tes questions sur ManagerPRO. Tu peux m’écrire dans la langue que tu préfères.</div>
        </section>

        <form id="chat-form">
            <div class="composer">
                <textarea id="question" rows="1" maxlength="8000" aria-label="Ton message" placeholder="Écris ton message..." required></textarea>
                <button id="send" type="submit">Envoyer</button>
            </div>
            <p class="hint">Entrée pour envoyer · Maj + Entrée pour aller à la ligne</p>
        </form>
    </main>
    <script>
        const messagesElement = document.querySelector("#messages");
        const form = document.querySelector("#chat-form");
        const input = document.querySelector("#question");
        const sendButton = document.querySelector("#send");
        let history = [];

        function addMessage(text, role, extraClass = "") {
            const element = document.createElement("div");
            element.className = `message ${role} ${extraClass}`.trim();
            element.textContent = text;
            messagesElement.append(element);
            messagesElement.scrollTop = messagesElement.scrollHeight;
            return element;
        }

        document.querySelector("#new-chat").addEventListener("click", () => {
            history = [];
            messagesElement.replaceChildren();
            addMessage(
                "Bonjour ! Je peux répondre à tes questions sur ManagerPRO. Tu peux m’écrire dans la langue que tu préfères.",
                "assistant"
            );
            input.focus();
        });

        document.querySelector("#close-assistant").addEventListener("click", () => {
            document.body.classList.add("assistant-closed");
        });

        document.querySelector("#assistant-launcher").addEventListener("click", () => {
            document.body.classList.remove("assistant-closed");
            input.focus();
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const question = input.value.trim();
            if (!question || sendButton.disabled) return;

            addMessage(question, "user");
            input.value = "";
            sendButton.disabled = true;
            sendButton.textContent = "…";
            const nextHistory = [...history, { role: "user", content: question }];
            const pending = addMessage("Je prépare une réponse…", "assistant");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: nextHistory })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "La demande a échoué.");
                if (typeof result.answer !== "string") throw new Error("Réponse invalide du serveur.");
                pending.textContent = result.answer;
                history = [...nextHistory, { role: "assistant", content: result.answer }];
            } catch (error) {
                pending.classList.add("error");
                pending.textContent = `Désolé, une erreur s’est produite : ${error.message}`;
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Envoyer";
                input.focus();
            }
        });
    </script>
</body>
</html>
